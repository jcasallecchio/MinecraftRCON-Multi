name: MineDev Web checks

on:
  push:
    paths:
      - "console/**"
      - "MineDevWeb/**"
      - "tools/sync_minedev_web.py"
      - ".github/workflows/minedev-web-checks.yml"
  pull_request:
    paths:
      - "console/**"
      - "MineDevWeb/**"
      - "tools/sync_minedev_web.py"
      - ".github/workflows/minedev-web-checks.yml"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Check packaged MineDev code
        run: python tools/sync_minedev_web.py
      - name: Check PHP syntax
        run: |
          sudo apt-get update
          sudo apt-get install -y php-cli
          find console -name '*.php' -type f -print0 | xargs -0 -n1 php -l
      - name: Check shell syntax
        run: bash -n MineDevWeb/run.sh
