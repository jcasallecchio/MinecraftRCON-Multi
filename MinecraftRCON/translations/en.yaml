configuration:
  rcon_token:
    name: RCON access token
    description: Secret with at least 32 characters, shared by the APIs and MineDev console.
  rcon_allowed_ips:
    name: API allowed IPs
    description: Optional comma-separated IP or CIDR list. Empty allows any IP that can reach the API.
  allow_list:
    name: Require player allowlist
    description: Disabled allows any player to join. Enable it to require names added to each world.
  emit_server_telemetry:
    name: Send Bedrock server telemetry
    description: Sends optional server telemetry to Mojang/Microsoft. MineDev continues using its local telemetry when this is off.
  public_hostname:
    name: Public hostname for worlds
    description: Optional DuckDNS or other public DNS name without http:// or a port. The add-on resolves its IPv4 at startup and advertises it for NetherNet UDP on each world.
  seed_worker_enabled:
    name: Calculate MineDev seed sectors on Home Assistant
    description: Runs the map calculation worker inside this add-on. It processes queued sectors only when the MineDev seed map requests them.
  seed_storage_path:
    name: MineDev storage path
    description: Absolute path to the MineDev private storage folder as seen inside Home Assistant, usually /share/htdocs/minedev/storage.
  backup_interval_hours:
    name: Backup interval (hours)
  backup_keep_count:
    name: Backups to keep
  instances:
    name: Worlds/instances
    description: Add 1 to 5 items using the form fields. Each item starts a separate Bedrock server.
    fields:
      id:
        name: Stable ID
        description: Use lowercase letters, numbers, hyphen, or underscore. Do not change it after world data is created.
      name:
        name: Display name
      world_name:
        name: World folder name
        description: To import an existing world, this must exactly match its folder inside worlds.
      udp_port:
        name: Game port
        description: Port used for NetherNet TCP signaling and UDP gameplay. Forward both TCP and UDP on this same port in your router.
