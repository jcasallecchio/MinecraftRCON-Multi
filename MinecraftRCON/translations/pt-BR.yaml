configuration:
  rcon_token:
    name: Token de acesso RCON
    description: Segredo com pelo menos 32 caracteres, compartilhado pelas APIs e pelo console MineDev.
  rcon_allowed_ips:
    name: IPs autorizados para a API
    description: Lista opcional de IPs ou CIDRs separados por vírgula. Vazio permite qualquer IP que alcance a API.
  allow_list:
    name: Exigir allowlist de jogadores
    description: Desativado permite a entrada de qualquer jogador. Ative para exigir nomes cadastrados em cada mundo.
  emit_server_telemetry:
    name: Enviar telemetria do servidor Bedrock
    description: Envia telemetria opcional do servidor à Mojang/Microsoft. O MineDev continua usando sua telemetria local com esta opção desligada.
  public_hostname:
    name: Hostname público dos mundos
    description: Opcional. Informe o DuckDNS ou outro DNS público sem http:// e sem porta. O add-on resolve o IPv4 ao iniciar e o anuncia no UDP NetherNet de cada mundo.
  seed_worker_enabled:
    name: Calcular setores da seed do MineDev no Home Assistant
    description: Executa o worker do mapa neste add-on. Ele processa setores somente quando o mapa do MineDev os solicita.
  seed_storage_path:
    name: Caminho do armazenamento do MineDev
    description: Caminho absoluto da pasta storage privada do MineDev, como vista pelo Home Assistant. Normalmente /share/htdocs/minedev/storage.
  backup_interval_hours:
    name: Intervalo de backup (horas)
  backup_keep_count:
    name: Quantidade de backups mantidos
  instances:
    name: Mundos/instâncias
    description: Adicione de 1 a 5 itens usando os campos do formulário. Cada item inicia um servidor Bedrock separado.
    fields:
      id:
        name: ID estável
        description: Use letras minúsculas, números, hífen ou sublinhado. Não altere depois de criar os dados do mundo.
      name:
        name: Nome exibido
      world_name:
        name: Nome da pasta do mundo
        description: Para importar um mundo existente, deve corresponder exatamente à pasta dentro de worlds.
      udp_port:
        name: Porta do jogo
        description: Porta usada para sinalização TCP e tráfego UDP do NetherNet. Encaminhe TCP e UDP nessa mesma porta no roteador.
